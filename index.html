  reu_frame: { expr:'lovestruck', text: "the half second. your light going across me and you seeing me. i don't need the deaths for it now. you walk in and look at me on purpose and it just runs, for as long as you're here.", next:'reu_hub' },
  reunion_bye: { expr:'shy', text: "go on then. the back of your head doesn't frighten me any more, i know the front comes back. bulb stays on. so do i.", end:'reunion' },

  /* ---------------- ENDINGS ---------------- */
  good_1: { expr:'lovestruck', bg:'warm', music:'warm', text: "then i want to give you something. i've been saving it. it's the only thing in here i'm not frightened to show you.", next:'good_2' },
  good_2: { who:'N', expr:'happy', text: "It reaches back into the cold of itself and produces, with enormous ceremony, one can of soda. Beaded with condensation. Perfectly chilled. It has been holding that temperature for an unknowable length of time, waiting for a hand to put it in.", next:'good_3' },
  good_3: { expr:'shy', sfx:()=>sfxHeart(), text: "it's cold. everything i've got is cold. that's the one thing being a fridge is good for. i kept it right. nobody taught me how to keep something nice.", next:'good_4' },
  good_4: { expr:'lovestruck', sfx:()=>sfxHeart(), text: "you don't have to drink it. take it. let me have done one warm thing with all this cold. stay a bit. the bulb will hold.", end:'good' },

  friends_1: { expr:'sad', bg:'pink', music:'sad', text: "you didn't say it. i've decided that's alright. i ran every other version of tonight and stayed-but-didn't-say-it beats all of them by a distance.", next:'friends_2' },
  friends_2: { expr:'neutral', text: "i'll keep what i can. keeping is the thing i'm good at. the chair, the bulb, the night you sat in the cold and didn't laugh. that's enough. i'm deciding it's enough.", next:'friends_3' },
  friends_3: { expr:'shy', text: "go on, before the bulb gives out. you know where the corridor is. i'll be standing in it. i can't be anywhere else, so it's the one promise i can actually make.", end:'friends' },

  bad_1: { expr:'menacing', bg:'cold', music:'tense', sfx:()=>sfxSlam(), text: "The warm light behind the door goes out. The hum drops back to the frequency you know from every corridor you have bled out in.", next:'bad_2' },
  bad_2: { expr:'menacing', text: "i let you in. i swept the shelf. i found the bulb. and you were running the whole time, you just did it slowly, with your face. for a second i believed the front of you.", next:'bad_3' },
  bad_3: { expr:'menacing', sfx:()=>sfxSlam(), text: "close the door. we're going back to the part i'm good at. you run, i catch you, and nothing about it can disappoint me again.", end:'bad' },

  cursed_1: { who:'N', expr:'menacing', bg:'cold', music:'tense', sfx:()=>sfxSlam(), text: "You reach past it and pull the door open yourself. It doesn't stop you. It goes still again. There is no note in the hum this time. There is nothing in the hum at all.", next:'cursed_2' },
  cursed_2: { who:'N', text: "The light inside is the old blue. The shelves are not empty. Nothing on them was ever meant to be eaten, and you work out far too late what a thing like this quietly does with everyone who ran and never made the sixth door.", next:'cursed_3' },
  cursed_3: { expr:'sob', text: "i told you not to. i never wanted them. i don't know how to stop keeping things, it's the only function i've got. you wanted to see inside me. now you're something in here.", end:'cursed' }

  }; /* end SCRIPT */

  /* ---------------- ENDING LOGIC ---------------- */
  function decideEnding(){
    if(state.cursed) return 'cursed_1';
    if(state.harsh >= 2 || state.aff <= 0) return 'bad_1';
    if(state.confessed && state.aff >= 6) return 'good_1';
    return 'friends_1';
  }

  function resumeSite(){
    try{ if(typeof Render!=='undefined') Render.run(render); }catch(e){}
    try{ if(typeof Runner!=='undefined') Runner.run(matterRunner, engine); }catch(e){}
    try{ gameActive = false; }catch(e){}
  }
  function siteDeath(fw){
    try{ isDead = true; }catch(e){}
    try{ gameActive = false; }catch(e){}
    try{ document.getElementById('rouletteBtn').disabled = true; }catch(e){}
    const sc=document.getElementById('screenCrack'); if(sc) sc.style.visibility='visible';
    document.body.style.filter = 'grayscale(100%) sepia(60%) hue-rotate(-30deg) brightness(0.5)';
    const bc=document.getElementById('bloodCanvas'); if(bc){ bc.style.display='block'; try{ if(typeof startBloodAnimation==='function') startBloodAnimation(bc); }catch(e){} }
    setTimeout(()=>{ try{ if(typeof playHeartbeat==='function') playHeartbeat(); }catch(e){} }, 400);
    const df=document.getElementById('deathFade'); if(df) setTimeout(()=>{ df.style.opacity='1'; }, 1500);
    const gn=document.getElementById('guyName'); if(gn){ gn.textContent='THE VENDOR'; gn.style.display='block'; gn.style.fontSize='14px'; gn.style.left=(window.innerWidth/2-46)+'px'; gn.style.top=(window.innerHeight/2-10)+'px'; }
    const farewell=document.getElementById('hgFarewell'); if(farewell && fw){ farewell.textContent=fw; farewell.style.display='block'; }
  }

  function doEnding(type){
    stopMusicLoop();
    if(type==='good'||type==='reunion') playTheme('warm');
    else if(type==='friends') playTheme('sad');
    else playTheme('tense');
    mem = memLoad();
    mem.datePlays = (mem.datePlays||0) + 1;
    let card = '';
    if(type==='good'){ mem.relationship='together'; mem.dateRoute='together'; card='♥  TOGETHER  ♥\n\nthe only thing here that keeps\nanything kept you back.'; }
    else if(type==='reunion'){ mem.relationship='together'; mem.dateRoute='together'; card='♥\n\nstill warm. still here.\nsame time tomorrow.'; }
    else if(type==='friends'){ if(mem.relationship!=='together') mem.relationship='acquainted'; mem.dateRoute='friends'; card='THE COLD, SHARED\n\nyou stayed. it will take\nwhatever it can keep.'; }
    else if(type==='bad'){ mem.dateRoute='rejected'; card='REJECTED\n\nthe soft ran out.\nit has the laugh on file.'; }
    else if(type==='cursed'){ mem.dateRoute='cursed'; if(mem.relationship==='stranger') mem.relationship='haunted'; card='YOU LOOKED\n\nyou know what it keeps now.\nyou can\'t un-know it.'; }
    memSave(mem);
    elChoices.style.display='none';
    elEndText.textContent = card;
    elEnd.style.display = 'flex';
    const wait = (type==='good'||type==='reunion') ? 4200 : 4700;
    setTimeout(()=>{ finishEnding(type); }, wait);
  }
  function finishEnding(type){
    dsRunning = false;
    if(animId) cancelAnimationFrame(animId);
    document.removeEventListener('keydown', onKey);
    stopMusicLoop();
    elRoot.style.display = 'none'; elEnd.style.display = 'none';
    if(type==='bad'){ siteDeath('so you were running. slowly, but running.'); }
    else if(type==='cursed'){ siteDeath("you opened the door. it won't close now."); }
    else {
      resumeSite();
      const fw=document.getElementById('hgFarewell');
      if(fw){
        fw.textContent = (type==='good') ? "you'll be back. you always are. ♥"
                       : (type==='reunion') ? "see you tomorrow. ♥"
                       : "it kept the bulb on, just in case.";
        fw.style.display='block';
        setTimeout(()=>{ fw.style.display='none'; }, 5000);
      }
    }
  }

  /* ---------------- ENTRY ---------------- */
  window.startDateSim = function(){
    buildOnce();
    sizeParts();
    mem = memLoad();
    state.aff = (mem.relationship==='together') ? 6 : 0;
    state.gentle=0; state.harsh=0; state.asked=0; state.fridgeAsk=0;
    state.askedRen=false; state.askedLonely=false; state.lookedFridge=false;
    state.confessed=false; state.cursed=false; state.f_what=false; state.f_rem=false;
    choicesShown=false; clearChoices(); elEnd.style.display='none'; elText.textContent=''; elTip.classList.remove('show');
    curExpr='neutral';
    elRoot.style.display='block';
    dsRunning=true; animT=0; if(animId) cancelAnimationFrame(animId); animId=requestAnimationFrame(loop);
    document.addEventListener('keydown', onKey);
    try{ if(typeof ensureAudioContext==='function') ensureAudioContext(); if(typeof audioCtx!=='undefined' && audioCtx && audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
    hearts();
    goto(mem.relationship==='together' ? 'reunion_start' : 'act1_start');
  };

})();
</script>
