<html lang="en">
<head>

  <script>
  /* if cdnjs is blocked or down, the whole page used to die on line one.
     grab a second copy before anything tries to destructure Matter. */
  if(!window.Matter){ document.write('<scr'+'ipt src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"><\/scr'+'ipt>'); }
  </script>
  <style>
    body { margin: 0; overflow: hidden; overscroll-behavior: none; background: #0b0f14; font-family: Arial; transition: filter 0.8s; -webkit-tap-highlight-color: transparent; }

    #header { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10000; pointer-events: none; }
    #header img { width: 420px; animation: spin 4s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    #economyBox { position: fixed; top: 130px; left: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 5px; width: 160px; font-family: monospace; }
    #fridgeCounter { background: #ddd; color: black; font-family: monospace; font-size: 14px; padding: 5px; text-align: center; }
    #shopMenu { display: none; background: #ccc; border: 1px solid #999; padding: 8px; font-family: monospace; font-size: 12px; color: black; }

    #rightUI { position: fixed; top: 110px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 15px; width: 250px; }
    #memorialText { font-size: 10px; color: rgba(255,255,255,0.3); text-align: center; margin-bottom: -10px; font-family: monospace; pointer-events: none; }

    #rouletteContainer { background: rgba(0,0,0,0.85); border: 1px solid #ff0000; padding: 15px; color: white; text-align: center; box-shadow: 0px 0px 15px rgba(255,0,0,0.5); }
    #rouletteContainer select, #rouletteContainer button { margin-top: 10px; cursor: pointer; padding: 5px; }
    #rouletteBtn { background: #440000; color: white; border: 1px solid red; font-weight: bold; width: 100%; }
    #rouletteBtn:hover { background: #ff0000; }
    #streakDisplay { margin-top: 8px; font-size: 11px; color: #aaa; min-height: 16px; }

    #paintContainer { background: rgba(0,0,0,0.85); border: 1px solid #ffff00; padding: 15px; color: white; text-align: center; box-shadow: 0px 0px 15px rgba(255,255,0,0.5); }

    #musicPlayer { position: fixed; bottom: 10px; left: 10px; z-index: 10000; width: 340px; background: rgba(0,0,0,0.75); color: white; padding: 10px; border: 1px solid #333; }
    .text-layer { position: relative; z-index: 10005; text-shadow: 2px 2px 4px black, -1px -1px 4px black, 0px 0px 8px black; pointer-events: none; }
    #controls button { margin: 3px; cursor: pointer; position: relative; z-index: 10005; }

    #viz { width: 320px; height: 80px; background: black; display: block; margin-top: 10px; transform-origin: bottom center; transition: transform 0.05s, filter 0.05s; position: relative; z-index: 10001; }
    #vizGlow { position: fixed; bottom: 0; left: 0; width: 100%; height: 140px; pointer-events: none; background: radial-gradient(circle, rgba(200,0,0,0.35), transparent); filter: blur(20px); opacity: 0.5; transition: opacity 0.1s; }
    #paintCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9998; pointer-events: none; }
    #cockroachVid { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: 9999996; pointer-events: none; }

    @keyframes deathShake {
      0% { transform: translate(0,0) rotate(0deg); } 20% { transform: translate(-15px,15px) rotate(-2deg); }
      40% { transform: translate(15px,-15px) rotate(2deg); } 60% { transform: translate(-15px,-15px) rotate(-2deg); }
      80% { transform: translate(15px,15px) rotate(2deg); } 100% { transform: translate(0,0) rotate(0deg); }
    }
    .shaking { animation: deathShake 0.1s infinite; }

    #deathFlash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: white; z-index: 99999999; pointer-events: none; opacity: 0; }
    #tunnelVision { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,1) 100%); z-index: 9999996; pointer-events: none; opacity: 0; transition: opacity 6s; }
    #deathBlur { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; backdrop-filter: blur(15px) grayscale(100%); z-index: 9999997; pointer-events: none; opacity: 0; transition: opacity 4s; }
    #screenCrack { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; z-index: 9999999; pointer-events: none; visibility: hidden; }
    #deathFade { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: black; opacity: 0; z-index: 9999998; pointer-events: none; transition: opacity 12s ease-in; }
    #bloodCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999995; pointer-events: none; display: none; }
    #ragdollBloodCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999994; pointer-events: none; display: block; }
    #driedBloodCanvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 9999993; pointer-events: none; display: block; }

    #guyPrompt { position: fixed; bottom: 180px; right: 70px; background: white; color: black; font-family: monospace; font-size: 12px; padding: 2px 6px; border: 1px solid black; z-index: 10001; pointer-events: none; }
    #guyName { position: fixed; top: 0; left: 0; color: white; font-family: monospace; font-size: 12px; text-shadow: 1px 1px 2px black; z-index: 10001; pointer-events: none; white-space: nowrap; display: block; }
    #musicFlash { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(255,0,0,0.15); opacity: 0; z-index: 9999990; pointer-events: none; transition: opacity 0.1s ease-out; }
    #bsodOverlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-size: cover; background-position: center; z-index: 100000000; cursor: none; }


    /* ===== THE VENDOR ===== */
    #vendorBox { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10000; width: 120px; height: 44px; background: #8f8f8f; color: #111; font-family: Arial; font-size: 13px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid #6f6f6f; user-select: none; }
    #vendorBox:hover { background: #9b9b9b; }
    #horrorGame { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #000; z-index: 100000001; overflow: hidden; transition: opacity 0.5s; }
    #hgCanvas { width: 100vw; height: 100vh; display: block; background: #000; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; will-change: transform; }
    #hgVignette { position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(circle at 50% 52%, rgba(0,0,0,0) 5%, rgba(0,0,0,0.5) 36%, rgba(0,0,0,0.9) 70%, #000 100%); }
    #hgBlack { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.8s; }
    #hgChamber { position: absolute; top: 18px; left: 0; width: 100%; text-align: center; color: #c40000; font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 3px; text-shadow: 0 0 6px #000, 0 0 2px #000; z-index: 4; pointer-events: none; }
    #hgMessage { position: absolute; top: 50%; left: 0; width: 100%; text-align: center; transform: translateY(-50%); color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 21px; text-shadow: 0 0 10px #000, 0 0 3px #000; opacity: 0; transition: opacity 0.45s; z-index: 4; pointer-events: none; padding: 0 20px; }
    #hgWhisper { position: absolute; bottom: 66px; left: 0; width: 100%; text-align: center; color: rgba(200,200,210,0.7); font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 1px; text-shadow: 0 0 8px #000, 0 0 3px #000; opacity: 0; transition: opacity 0.8s; z-index: 4; pointer-events: none; padding: 0 30px; }
    #hgHint { position: absolute; bottom: 18px; left: 0; width: 100%; text-align: center; color: rgba(255,255,255,0.45); font-family: monospace; font-size: 12px; opacity: 0; transition: opacity 0.6s; z-index: 4; pointer-events: none; }
    #hgIntro { position: absolute; inset: 0; background: #000; z-index: 6; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-family: 'Courier New', monospace; color: #cfcfcf; text-align: center; padding: 0 26px; cursor: pointer; }
    #hgIntro .hgLine { font-size: 18px; opacity: 0; animation: hgFadeIn 1.3s forwards; max-width: 580px; }
    #hgIntro #hgBegin { margin-top: 28px; font-size: 15px; color: #c40000; opacity: 0; animation: hgFadeIn 1.3s forwards; }
    @keyframes hgFadeIn { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    /* ===== TOUCH CONTROLS ===== */
    #hgTouch { display: none; position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    #hgTouch.on { display: block; }
    #hgStick { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 148px; height: 148px; border-radius: 50%;
               border: 2px solid rgba(200,200,210,0.20); background: rgba(255,255,255,0.035);
               pointer-events: auto; touch-action: none; }
    #hgKnob { position: absolute; left: 50%; top: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px;
              border-radius: 50%; background: rgba(220,220,230,0.20); border: 1px solid rgba(220,220,230,0.34); }
    #hgLight { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(42px + env(safe-area-inset-bottom)); width: 78px; height: 78px; border-radius: 50%;
               border: 2px solid rgba(196,0,0,0.45); background: rgba(40,0,0,0.30); color: #d0d0d0;
               font-family: 'Courier New', monospace; font-size: 11px; letter-spacing: 1px; line-height: 1.2;
               display: flex; align-items: center; justify-content: center; text-align: center;
               pointer-events: auto; touch-action: none; user-select: none; }
    #hgLight:active { background: rgba(120,0,0,0.5); }
    #hgStay { display: none; position: absolute; right: calc(18px + env(safe-area-inset-right)); bottom: calc(140px + env(safe-area-inset-bottom)); padding: 16px 22px;
              border: 1px solid rgba(255,150,200,0.6); background: rgba(60,10,40,0.55); color: #ffd9ec;
              font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 2px;
              pointer-events: auto; touch-action: none; user-select: none; }
    #hgStay.on { display: block; }
    #hgStay:active { background: rgba(140,30,90,0.7); }

    /* ===== MOBILE =====
       same layout as the desktop site, same four corners, just shrunk.
       --ui-scale is set in js from the viewport so the desktop
       arrangement always fits without the panels touching. */
    #uiToggle { display: none; }

    @media (max-width: 880px), (pointer: coarse) {
      #header { top: calc(10px * var(--ui-scale, 1)); }
      /* it spins, so its real footprint is the rotated bounding box, not
         the banner. 26vw keeps that sweep out of the top corners and is
         about the fraction of the screen it takes up on desktop anyway. */
      #header img { width: min(calc(420px * var(--ui-scale, 1)), 26vw); }

      #economyBox {
        transform: scale(var(--ui-scale, 1)); transform-origin: top left;
        top: calc(130px * var(--ui-scale, 1)); left: 10px; }

      #rightUI {
        transform: scale(var(--ui-scale, 1)); transform-origin: top right;
        top: calc(110px * var(--ui-scale, 1)); right: 10px; }

      #musicPlayer {
        transform: scale(var(--ui-scale, 1)); transform-origin: bottom left;
        left: 8px; bottom: 8px; }

      /* the one thing that can't stay put: at desktop widths the music
         player is nowhere near the middle, on a phone it is. */
      #vendorBox { bottom: calc(14px + 205px * var(--ui-scale, 1)); }

      #uiToggle { display: flex; position: fixed; top: 8px; right: 8px; z-index: 10030;
                  width: 38px; height: 38px; align-items: center; justify-content: center;
                  background: rgba(20,23,28,0.8); color: #cfcfcf; border: 1px solid #3a3f47;
                  font-family: monospace; font-size: 17px; cursor: pointer; }

      /* opacity, not translate: a transform here would wipe out the scale */
      body.ui-hidden #economyBox,
      body.ui-hidden #rightUI,
      body.ui-hidden #musicPlayer,
      body.ui-hidden #guyPrompt { opacity: 0; pointer-events: none; }
      #economyBox, #rightUI, #musicPlayer { transition: opacity .22s ease; }
    }

    /* width:100% plus horizontal padding on a content-box element is wider
       than the screen, which is why the hint ran off the right edge. */
    #hgHint { box-sizing: border-box; padding: 0 18px; line-height: 1.45; }
    @media (max-width: 880px), (pointer: coarse) {
      #hgHint { bottom: 208px; font-size: 11px; }
    }

    #hgFarewell { display: none; position: fixed; top: 58%; left: 0; width: 100%; text-align: center; color: rgba(205,205,205,0.85); font-family: 'Courier New', monospace; font-size: 16px; letter-spacing: 1px; text-shadow: 0 0 6px #000; z-index: 10000002; pointer-events: none; padding: 0 30px; }
  </style>
</head>
<body>

<audio id="sfx-revolver" src="revolver.mp3" preload="none"></audio>

<div id="deathFlash"></div>

<div id="deathBlur"></div>

<div id="deathFade"></div>
<canvas id="bloodCanvas"></canvas>

<canvas id="paintCanvas"></canvas>

<div id="guyPrompt">[click me]</div>
<div id="guyName"></div>
<div id="musicFlash"></div>
<div id="bsodOverlay"></div>

<!-- THE VENDOR -->
<div id="vendorBox" onclick="startHorrorGame()">click me</div>
<div id="horrorGame">
  <canvas id="hgCanvas"></canvas>
  <div id="hgVignette"></div>
  <div id="hgBlack"></div>
  <div id="hgChamber"></div>
  <div id="hgMessage"></div>
  <div id="hgWhisper"></div>
  <div id="hgHint"></div>
  <div id="hgIntro"></div>
  <div id="hgTouch">
    <div id="hgStick"><div id="hgKnob"></div></div>
    <div id="hgLight">LIGHT</div>
    <div id="hgStay">STAY</div>
  </div>
</div>

<button id="uiToggle" aria-label="Show or hide the panels">≡</button>
<div id="header"><img src="cooltext509446167575809.gif" alt="fridges for sale"></div>

<div id="economyBox">
  <button onclick="spawnFridge()">spawn fridge</button>
  <div id="fridgeCounter">Fridges: 0</div>
  <button onclick="toggleShop()">fridge shop</button>
  <div id="shopMenu">
    <b>SHOP</b><br><br>
    Autoclicker (50F)<br>
    <button onclick="buyAutoclicker()">Buy</button><br><br>
    Autoclicker II (1000F)<br>
    <button id="buyAutoclicker2" onclick="buyAutoclicker2()">Buy</button>
  </div>
  <button onclick="fireFridgeCannon()">fridge cannon</button>
</div>

<div id="rightUI">
  <div id="memorialText">R.I.P. LEGACY RUSSIAN ROULLETE SYSTEM, REN IS THE KING. 38.</div>
  <div id="rouletteContainer">
    <div style="font-weight:bold; color:red;">RUSSIAN ROULETTE</div>
    <label style="font-size:12px;">Bullets in chamber:</label><br>
    <select id="bulletCount" onchange="reloadRevolver()">
      <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6 (Guaranteed Death)</option>
    </select><br>
    <button id="rouletteBtn" onclick="playRoulette()">PULL TRIGGER</button>
    <div id="rouletteResult" style="margin-top:10px; font-weight:bold; font-size:14px;"></div>
    <div id="streakDisplay"></div>
  </div>
  <div id="paintContainer">
    <div style="font-weight:bold; color:yellow;">MS PAINT MODE</div>
    <label style="font-size:12px;"><input type="checkbox" id="drawToggle"> Enable Drawing</label>
    <input type="color" id="drawColor" value="#ff0000">
    <input type="range" id="drawSize" min="1" max="50" value="5" title="Brush Size"><br>
    <button onclick="document.getElementById('eraserBtn').click()" id="eraserBtn">Eraser</button>
    <button onclick="clearCanvas()">Clear All</button>
  </div>
</div>

<div id="musicPlayer">
  <div class="text-layer" style="font-weight:bold; margin-bottom:5px;">LISTEN TO THIS TRACK, BIATCH!</div>
  <div id="nowPlaying" class="text-layer">now playing: loading...</div>
  <audio id="audio"></audio>
  <div id="controls"><button onclick="prevSong()">prev</button><button onclick="togglePlay()">play/pause</button><button onclick="nextSong()">next</button></div>
  <canvas id="viz"></canvas>
</div>
<div id="vizGlow"></div>

<script>
/* ===== SCREEN CRACK & BSOD CACHE-BUSTING ===== */
(function() { const d=document.getElementById('screenCrack'); const img=new Image(); img.onload=function(){ d.style.backgroundImage=`url(${img.src})`; }; img.src='screencrack.png?t='+Date.now(); })();
(function() { const d=document.getElementById('bsodOverlay'); const img=new Image(); img.onload=function(){ d.style.backgroundImage=`url(${img.src})`; }; img.src='BSOD.png?t='+Date.now(); })();

/* ===== GLOBAL AUDIO CONTEXT ===== */
let audioCtx = null;
let gameActive = false;
function ensureAudioContext() { if (audioCtx) return; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { console.warn("AudioContext not supported."); } }

/* ===== ECONOMY & FRIDGE PHYSICS ===== */
let fridgesOwned = 0;
const spawnedFridges = [];
let autoclicker2Active = false;
function updateCounter() { document.getElementById("fridgeCounter").innerText = `Fridges: ${fridgesOwned}`; }
function toggleShop() { const s=document.getElementById("shopMenu"); s.style.display = (s.style.display==="block") ? "none" : "block"; }
function buyAutoclicker() {
  if (fridgesOwned>=50) {
    const removed = spawnedFridges.splice(-50); removed.forEach(f => Matter.World.remove(world, f));
    fridgesOwned -= 50; updateCounter(); setInterval(spawnFridge,1000); event.target.disabled = true;
  } else alert("NOT ENOUGH FRIDGES. YOU NEED 50.");
}
function buyAutoclicker2() {
  if (fridgesOwned >= 1000 && !autoclicker2Active) {
    const count = Math.min(1000, spawnedFridges.length);
    const removed = spawnedFridges.splice(-count); removed.forEach(f => Matter.World.remove(world, f));
    fridgesOwned -= 1000; updateCounter(); autoclicker2Active = true; setInterval(spawnFridge, 500);
    document.getElementById('buyAutoclicker2').disabled = true; document.getElementById('buyAutoclicker2').innerText = 'Bought';
  } else if (autoclicker2Active) { alert("Already purchased!"); }
  else { alert("NOT ENOUGH FRIDGES. YOU NEED 1000."); }
}

var physicsOK = !!window.Matter;
if(!physicsOK){ console.warn('matter.js never arrived. physics is off, everything else still runs.'); }
const { Engine, Render, Runner, Bodies, World, Mouse, MouseConstraint, Constraint, Events } = (window.Matter || {
  Engine:{create:()=>({world:{}})}, Render:{create:()=>({canvas:document.createElement('canvas'),options:{}}),run(){},stop(){}},
  Runner:{create:()=>({}),run(){},stop(){}}, Bodies:{rectangle:()=>({position:{x:0,y:0},velocity:{x:0,y:0}}),circle:()=>({position:{x:0,y:0},velocity:{x:0,y:0}})},
  World:{add(){},remove(){}}, Mouse:{create:()=>({})}, MouseConstraint:{create:()=>({mouse:{}})},
  Constraint:{create:()=>({})}, Events:{on(){}}
});
const engine = Engine.create();
const world = engine.world;
const render = Render.create({ element: document.body, engine, options: { width: window.innerWidth, height: window.innerHeight, wireframes: false, background: "#0b0f14" } });
Render.run(render);
const matterRunner = Runner.create();
Runner.run(matterRunner, engine);

const ground = Bodies.rectangle(window.innerWidth/2, window.innerHeight+50, window.innerWidth, 100, { isStatic:true, label:'wall' });
const leftWall = Bodies.rectangle(-25, window.innerHeight/2, 50, window.innerHeight*2, { isStatic:true, label:'wall' });
const rightWall = Bodies.rectangle(window.innerWidth+25, window.innerHeight/2, 50, window.innerHeight*2, { isStatic:true, label:'wall' });
const ceiling = Bodies.rectangle(window.innerWidth/2, -100, window.innerWidth, 100, { isStatic:true, label:'wall' });
World.add(world, [ground, leftWall, rightWall, ceiling]);

const fridgeImages = ["fridge1.png","fridge2.png","fridge3.png"];
/* a hard ceiling. matter.js does not care how funny the joke is, it will
   choke at a few hundred bodies and take the tab with it. oldest goes first. */
const FRIDGE_LIMIT = (navigator.maxTouchPoints > 0 || window.innerWidth < 880) ? 55 : 150;
function trimFridges(){
  while(spawnedFridges.length > FRIDGE_LIMIT){
    const old = spawnedFridges.shift();
    try{ Matter.World.remove(world, old); }catch(e){}
  }
}
function spawnFridge() {
  if(!physicsOK) return;
  fridgesOwned++; updateCounter();
  const img = fridgeImages[Math.floor(Math.random()*fridgeImages.length)];
  const fridge = Bodies.rectangle(Math.random()*window.innerWidth, 50, 100, 150, { restitution:0.6, friction:0.2, render: { sprite: { texture: img, xScale:0.35, yScale:0.35 } } });
  World.add(world, fridge); spawnedFridges.push(fridge); trimFridges();
}
const mouse = Mouse.create(render.canvas);
const mouseConstraint = MouseConstraint.create(engine, { mouse, constraint: { stiffness:0.2, render:{visible:false} } });
World.add(world, mouseConstraint);
render.mouse = mouse;
let physResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(physResizeTimer);
  physResizeTimer = setTimeout(() => {
    if(!physicsOK) return;
    const W = window.innerWidth, H = window.innerHeight;
    render.canvas.width = W; render.canvas.height = H;
    render.options.width = W; render.options.height = H;
    /* the ground used to move on its own and the other three stayed at
       load-time coordinates, which is how fridges escaped sideways. */
    Matter.Body.setPosition(ground,    { x: W/2,  y: H+50 });
    Matter.Body.setPosition(ceiling,   { x: W/2,  y: -100 });

function playHeartbeat() {
  if(!audioCtx) return;
  let beatTime = audioCtx.currentTime, interval = 0.8;
  for(let i=0;i<12;i++) {
    const t=beatTime;
    const o1=audioCtx.createOscillator(),g1=audioCtx.createGain();
    o1.type="sine"; o1.frequency.setValueAtTime(80,t); o1.frequency.exponentialRampToValueAtTime(20,t+0.3);
    g1.gain.setValueAtTime(0,t); g1.gain.linearRampToValueAtTime(2.5,t+0.1); g1.gain.exponentialRampToValueAtTime(0.001,t+0.4);
    o1.connect(g1); g1.connect(audioCtx.destination); o1.start(t); o1.stop(t+0.5);
    const o2=audioCtx.createOscillator(),g2=audioCtx.createGain();
    o2.type="triangle"; o2.frequency.setValueAtTime(50,t+0.25); o2.frequency.exponentialRampToValueAtTime(15,t+0.6);
    g2.gain.setValueAtTime(0,t+0.25); g2.gain.linearRampToValueAtTime(2.2,t+0.35); g2.gain.exponentialRampToValueAtTime(0.001,t+0.7);
    o2.connect(g2); g2.connect(audioCtx.destination); o2.start(t+0.25); o2.stop(t+0.8);
    beatTime += interval; interval *= 1.12;
  }
}

let bloodAnimationId=null, particles=[], settledStains=[], dripsGlobal=[], edgeDrips=[], poolLevel=0;
function burstParticles(cx,cy,count,minSpeed,maxSpeed,minSize,maxSize) {
  for(let i=0;i<count;i++) {
    const angle=Math.random()*Math.PI*2, speed=minSpeed+Math.random()*(maxSpeed-minSpeed);
    const vx=Math.cos(angle)*speed, vy=Math.sin(angle)*speed;
    particles.push({ x:cx,y:cy, vx,vy, life:8+Math.random()*25, maxLife:8+Math.random()*25, size:minSize+Math.random()*(maxSize-minSize), color:`rgba(${40+Math.floor(Math.random()*60)},${Math.floor(Math.random()*10)},${Math.floor(Math.random()*10)},${0.6+Math.random()*0.4})`, trail:[] });
  }
}
function startBloodAnimation(canvas) {
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  particles=[]; settledStains=[]; dripsGlobal=[]; edgeDrips=[]; poolLevel=0;
  burstParticles(canvas.width/2,canvas.height/2,400,4,15,1,8);
  if(bloodAnimationId) cancelAnimationFrame(bloodAnimationId);
  bloodAnimationId=requestAnimationFrame(animateBlood);
}
function secondaryBloodBurst() { burstParticles(window.innerWidth/2,window.innerHeight/2,200,2,10,0.5,4); }
function animateBlood(timestamp) {
  const canvas=document.getElementById('bloodCanvas');
  if(canvas.style.display==='none') return;
  const ctx=canvas.getContext('2d'); ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.93; p.vy*=0.93+0.02; p.life--;
    p.trail.push({x:p.x,y:p.y}); if(p.trail.length>4) p.trail.shift();
    if(p.trail.length>1) { ctx.beginPath(); ctx.moveTo(p.trail[0].x,p.trail[0].y); for(let t=1;t<p.trail.length;t++) ctx.lineTo(p.trail[t].x,p.trail[t].y); ctx.strokeStyle=p.color.replace(/[\d\.]+\)$/g,'0.3)'); ctx.lineWidth=p.size*0.6; ctx.stroke(); }
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill();
    if(p.y<=0||p.x<=0||p.x>=canvas.width) { settledStains.push({ x:Math.max(0,Math.min(canvas.width,p.x)), y:Math.max(0,p.y), size:p.size*0.7, color:p.color }); particles.splice(i,1); continue; }
    if(p.life<=0||(Math.abs(p.vx)<0.2&&Math.abs(p.vy)<0.2)) { settledStains.push({x:p.x,y:p.y,size:p.size*0.8,color:p.color}); particles.splice(i,1); }
  }
  for(const stain of settledStains) { ctx.beginPath(); ctx.arc(stain.x,stain.y,stain.size,0,Math.PI*2); ctx.fillStyle=stain.color; ctx.fill(); }
  if(edgeDrips.length===0&&particles.length===0&&settledStains.length>0) {
    for(let i=0;i<25;i++) { const x=Math.random()*canvas.width; edgeDrips.push({sx:x,sy:0,ex:x,ey:0,speed:0.5+Math.random()*1.5,color:'rgba(70,0,0,0.8)',alive:true,thickness:1+Math.random()*2}); }
    for(let i=0;i<15;i++) { const y=Math.random()*canvas.height; edgeDrips.push({sx:0,sy:y,ex:0,ey:y,speed:0.5+Math.random()*1.2,color:'rgba(70,0,0,0.8)',alive:true,thickness:1+Math.random()*2}); edgeDrips.push({sx:canvas.width,sy:y,ex:canvas.width,ey:y,speed:0.5+Math.random()*1.2,color:'rgba(70,0,0,0.8)',alive:true,thickness:1+Math.random()*2}); }
  }
  if(dripsGlobal.length===0&&particles.length===0&&settledStains.length>0) {
    for(const stain of settledStains) { if(Math.random()<0.4) dripsGlobal.push({sx:stain.x,sy:stain.y,ex:stain.x,ey:stain.y,speed:0.2+Math.random()*1.0,color:stain.color,alive:true,thickness:stain.size*0.5,branches:[]}); }
  }
  for(const drip of dripsGlobal) {
    if(!drip.alive) continue; drip.ey+=drip.speed; drip.ex+=(Math.random()-0.5)*0.6;
    const grad=ctx.createLinearGradient(drip.sx,drip.sy,drip.ex,drip.ey); grad.addColorStop(0,drip.color); grad.addColorStop(1,drip.color.replace(/[\d\.]+\)$/g,'0.2)'));
    ctx.beginPath(); ctx.moveTo(drip.sx,drip.sy); ctx.lineTo(drip.ex,drip.ey); ctx.strokeStyle=grad; ctx.lineWidth=drip.thickness; ctx.stroke();
    if(Math.random()<0.01) drip.branches.push({ex:drip.ex,ey:drip.ey,speed:drip.speed*0.7,color:drip.color});
    for(const b of drip.branches) { b.ey+=b.speed; b.ex+=(Math.random()-0.5)*0.5; ctx.beginPath(); ctx.moveTo(drip.ex,drip.ey); ctx.lineTo(b.ex,b.ey); ctx.strokeStyle=b.color; ctx.lineWidth=0.8; ctx.stroke(); }
    if(drip.ey>=canvas.height) { drip.alive=false; poolLevel+=0.2; }
  }
  for(const drip of edgeDrips) {
    if(!drip.alive) continue; drip.ey+=drip.speed; drip.ex+=(Math.random()-0.5)*0.5;
    ctx.beginPath(); ctx.moveTo(drip.sx,drip.sy); ctx.lineTo(drip.ex,drip.ey); ctx.strokeStyle=drip.color; ctx.lineWidth=drip.thickness; ctx.stroke();
    if(drip.ey>=canvas.height) { drip.alive=false; poolLevel+=0.15; }
  }
  poolLevel=Math.min(poolLevel,60);
  if(poolLevel>0) { ctx.fillStyle=`rgba(50,0,0,${0.6+poolLevel/200})`; ctx.fillRect(0,canvas.height-poolLevel,canvas.width,poolLevel); }
  bloodAnimationId=requestAnimationFrame(animateBlood);
}

function playScream() {

  const osc1 = audioCtx.createOscillator(); const gain1 = audioCtx.createGain();
  osc1.type = 'sawtooth'; osc1.frequency.setValueAtTime(400, now); osc1.frequency.exponentialRampToValueAtTime(150, now + 0.8);
  gain1.gain.setValueAtTime(0, now); gain1.gain.linearRampToValueAtTime(1.2, now + 0.05); gain1.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
  osc1.connect(gain1);
  const waveshaper = audioCtx.createWaveShaper();
  const curve = new Float32Array(256);
  for (let i = 0; i < 256; i++) { const x = (i - 128) / 128; curve[i] = Math.tanh(x * 3); }

  const formantFilter = audioCtx.createBiquadFilter();
  formantFilter.type = 'peaking'; formantFilter.frequency.setValueAtTime(900, now); formantFilter.frequency.exponentialRampToValueAtTime(600, now + 0.6);
  formantFilter.Q.setValueAtTime(6, now); formantFilter.gain.setValueAtTime(25, now);

  const vibrato = audioCtx.createOscillator(); const vibratoGain = audioCtx.createGain();
  vibrato.frequency.setValueAtTime(18, now); vibratoGain.gain.setValueAtTime(40, now);
  vibrato.connect(vibratoGain); vibratoGain.connect(osc1.frequency); vibrato.start(now); vibrato.stop(now + 1.2);
  const osc2 = audioCtx.createOscillator(); const gain2 = audioCtx.createGain();
  osc2.type = 'square'; osc2.frequency.setValueAtTime(1200, now); osc2.frequency.exponentialRampToValueAtTime(800, now + 0.5);
  gain2.gain.setValueAtTime(0, now); gain2.gain.linearRampToValueAtTime(0.4, now + 0.03); gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.9);
  osc2.connect(gain2); gain2.connect(audioCtx.destination);

        u8[o+3] = 255;
      }
      levels.push(u32);
    }
    return levels;
  }

  /* ---------- AUDIO ---------- */
  let drone, droneG, hum1, hum2, humG, humLP, humPan, fanSrc, fanG;
  let heartTimer = null;
  function startAudio(){
    if(!audioCtx) return;
    try{
      drone = audioCtx.createOscillator(); droneG = audioCtx.createGain();
      drone.type='sine'; drone.frequency.value=41; droneG.gain.value=0.14;
      drone.connect(droneG); droneG.connect(audioCtx.destination); drone.start();

      humG = audioCtx.createGain(); humG.gain.value=0.0001;
      humLP = audioCtx.createBiquadFilter(); humLP.type='lowpass'; humLP.frequency.value=760;
      humPan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
      humG.connect(humLP);
      if(humPan){ humLP.connect(humPan); humPan.connect(audioCtx.destination); }
      else humLP.connect(audioCtx.destination);

      hum1 = audioCtx.createOscillator(); hum1.type='sawtooth'; hum1.frequency.value=58;
      hum2 = audioCtx.createOscillator(); hum2.type='square';   hum2.frequency.value=87.3;
      const h1g=audioCtx.createGain(); h1g.gain.value=0.5;
      const h2g=audioCtx.createGain(); h2g.gain.value=0.18;
      hum1.connect(h1g); h1g.connect(humG);
      hum2.connect(h2g); h2g.connect(humG);
      hum1.start(); hum2.start();

      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*2, audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      fanSrc = audioCtx.createBufferSource(); fanSrc.buffer=buf; fanSrc.loop=true;
      const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=320; bp.Q.value=0.8;
      fanG = audioCtx.createGain(); fanG.gain.value=0.0001;
      fanSrc.connect(bp); bp.connect(fanG); fanG.connect(audioCtx.destination); fanSrc.start();
    }catch(e){}
  }
  function setHum(vol){
    if(!audioCtx||!humG) return;
    const t=audioCtx.currentTime;
    humG.gain.setTargetAtTime(Math.max(0.0001,vol), t, 0.12);
    if(fanG) fanG.gain.setTargetAtTime(Math.max(0.0001,vol*0.4), t, 0.12);
  }
  /* pan the hum to whichever side the thing actually is. this is the
     single cheapest scare in the whole build. */
  function panHum(){
    if(!humPan || !audioCtx) return;
    const dx = ven.x-posX, dy = ven.y-posY;
    const right = dx*planeX + dy*planeY;
    const fwd   = dx*dirX  + dy*dirY;
    const mag = Math.hypot(right, fwd) || 1;
    humPan.pan.setTargetAtTime(clamp(right/mag, -1, 1), audioCtx.currentTime, 0.2);
    if(humLP) humLP.frequency.setTargetAtTime(fwd > 0 ? 900 : 480, audioCtx.currentTime, 0.3);
  }
  function humSpike(){ if(humG&&audioCtx) humG.gain.setTargetAtTime(0.85, audioCtx.currentTime, 0.05); }
  function humMax(){ if(humG&&audioCtx) humG.gain.setTargetAtTime(1.0, audioCtx.currentTime, 0.05); }
  function humUnderDeath(){ setHum(0.22); }
  function stopAudio(){
    try{ drone.stop(); hum1.stop(); hum2.stop(); fanSrc.stop(); }catch(e){}
    if(heartTimer){ clearInterval(heartTimer); heartTimer=null; }
  }
  function playPickup(){
    if(!audioCtx) return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(440,t); o.frequency.exponentialRampToValueAtTime(180,t+0.3);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.25,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.36);
    const o2=audioCtx.createOscillator(), g2=audioCtx.createGain();
    o2.type='triangle'; o2.frequency.value=93;
    g2.gain.setValueAtTime(0.0001,t); g2.gain.linearRampToValueAtTime(0.2,t+0.02); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
    o2.connect(g2); g2.connect(audioCtx.destination); o2.start(t); o2.stop(t+0.52);
  }
  function thump(vol){
    if(!audioCtx) return;
    const t=audioCtx.currentTime;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(74,t); o.frequency.exponentialRampToValueAtTime(28,t+0.22);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol||0.55,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.36);
  }
  /* your footsteps, and sometimes one more after you've stopped */
  function step(soft){
    if(!audioCtx) return;
    const t=audioCtx.currentTime;
    const len=(audioCtx.sampleRate*0.07)|0;
    const b=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const d=b.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
    const s=audioCtx.createBufferSource(); s.buffer=b;
    const f=audioCtx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=soft?300:520;
    const g=audioCtx.createGain(); g.gain.value=soft?0.16:0.09;
    s.connect(f); f.connect(g); g.connect(audioCtx.destination); s.start(t);
  }

  /* ---------- CANVAS / BUFFERS ---------- */
  let imgData=null, buf32=null, zbuf=null, CW=0, CH=0, horizonY=0, viewPitch=0, projDist=0;
  function resize(){
    /* drive resolution off a pixel budget, not a fixed fraction. a fixed
       fraction gave a tall phone a 200px wide buffer, which is why it
       looked like a screenshot of a screenshot. */
    const VW = window.innerWidth, VH = window.innerHeight;
    const budget = IS_TOUCH ? 210000 : 390000;
    let scale = Math.sqrt(budget/(VW*VH));
    scale = clamp(scale, 0.28, IS_TOUCH ? 0.68 : 0.60);
    let w = clamp(Math.floor(VW*scale), 220, 820);
    let h = clamp(Math.floor(VH*scale), 150, 620);
    if(w===CW && h===CH) return;
    canvas.width=w; canvas.height=h;
    ctx.imageSmoothingEnabled=false;
    imgData = ctx.createImageData(w,h);
    buf32 = new Uint32Array(imgData.data.buffer);
    zbuf = new Float32Array(w);
    CW=w; CH=h;
    /* wall height was tied to canvas height, so a 9:19.5 phone held
       upright stretched everything into a tunnel. tie it to width and
       hold a floor for portrait so you aren't staring at acres of lino. */
    projDist = Math.max(w*0.75, h*0.72);
  }
  let resizeTimer=null;
  window.addEventListener('resize', ()=>{
    if(!gameActive) return;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 120);
  });

  /* ---------- RENDER ---------- */
  function render3d(){
    const w=CW, h=CH;
    const horizon = horizonY;
    const maxD = 4.5 + lightLevel*8;
    const posZ = 0.5*projDist;
    const invW = 1/w;
    const rdx0=dirX-planeX, rdy0=dirY-planeY, rdx1=dirX+planeX, rdy1=dirY+planeY;
    const dRX = (rdx1-rdx0)*invW, dRY = (rdy1-rdy0)*invW;

    /* ceiling */
    for(let y=0;y<horizon;y++){
      const rowDist = posZ/(horizon-y);
      let si = ((1 - rowDist/maxD)*(SHADES-1))|0;
      si = si<0?0:(si>SHADES-1?SHADES-1:si);
      const tex = ceilLUT[si>4?si-4:0];
      const sx = rowDist*dRX, sy = rowDist*dRY;
      let fx = posX + rowDist*rdx0, fy = posY + rowDist*rdy0;
      const row = y*w;
      for(let x=0;x<w;x++){
        const tx = ((TEX*(fx-(fx|0)))|0) & TEXMASK;
        const ty = ((TEX*(fy-(fy|0)))|0) & TEXMASK;
        buf32[row+x] = tex[(ty<<6)+tx];
        fx+=sx; fy+=sy;
      }
    }
    /* floor. p starts at 1 on the horizon row itself, so there is no
       skipped row to paper over afterwards. */
    for(let y=horizon;y<h;y++){
      const p = y-horizon+1;
      const rowDist = posZ/p;
      let si = ((1 - rowDist/maxD)*(SHADES-1))|0;
      si = si<0?0:(si>SHADES-1?SHADES-1:si);
      const tex = floorLUT[si];
      const sx = rowDist*dRX, sy = rowDist*dRY;
      let fx = posX + rowDist*rdx0, fy = posY + rowDist*rdy0;
      const row = y*w;
      for(let x=0;x<w;x++){
        const tx = ((TEX*(fx-(fx|0)))|0) & TEXMASK;
        const ty = ((TEX*(fy-(fy|0)))|0) & TEXMASK;
        buf32[row+x] = tex[(ty<<6)+tx];
        fx+=sx; fy+=sy;
      }
    }
    /* walls */
    for(let x=0;x<w;x++){
      const cameraX = 2*x*invW - 1;
      const rdx = dirX + planeX*cameraX, rdy = dirY + planeY*cameraX;
      let mx = posX|0, my = posY|0;
      const ddx = rdx===0 ? 1e30 : Math.abs(1/rdx);
      const ddy = rdy===0 ? 1e30 : Math.abs(1/rdy);
      let stepX, stepY, sdx, sdy;
      if(rdx<0){ stepX=-1; sdx=(posX-mx)*ddx; } else { stepX=1; sdx=(mx+1-posX)*ddx; }
      if(rdy<0){ stepY=-1; sdy=(posY-my)*ddy; } else { stepY=1; sdy=(my+1-posY)*ddy; }
      let hit=0, side=0, guard=0;
      while(!hit && guard++<160){
        if(sdx<sdy){ sdx+=ddx; mx+=stepX; side=0; }
        else       { sdy+=ddy; my+=stepY; side=1; }
        if(mx<0||my<0||mx>=MW||my>=MH){ hit=1; break; }
        if(map[mx][my]===1) hit=1;
      }
      let pwd = side===0 ? (sdx-ddx) : (sdy-ddy);
      if(pwd<0.02) pwd=0.02;
      zbuf[x]=pwd;
      const lineH = (projDist/pwd)|0;
      if(lineH<=0) continue;
      const half = lineH>>1;
      const dStart = horizon-half, dEnd = horizon+half;
      let wallX = side===0 ? posY+pwd*rdy : posX+pwd*rdx;
      wallX -= wallX|0;
      let texX = (wallX*TEX)|0;
      if((side===0 && rdx>0) || (side===1 && rdy<0)) texX = TEX-texX-1;
      texX &= TEXMASK;
      let si = ((1 - pwd/maxD)*(SHADES-1))|0;
      if(side===1) si -= 5;
      si = si<0?0:(si>SHADES-1?SHADES-1:si);
      const tex = wallLUT[(((mx*7+my*13)>>>0) % wallLUT.length)][si];
      const stepT = TEX/lineH;
      const y0 = dStart<0?0:dStart;
      const y1 = dEnd>=h?h-1:dEnd;
      let texPos = (y0 - horizon + half) * stepT;
      let idx = y0*w+x;
      for(let y=y0;y<=y1;y++){
        buf32[idx] = tex[(((texPos|0)&TEXMASK)<<6)+texX];
        texPos += stepT;
        idx += w;
      }
    }
    ctx.putImageData(imgData,0,0);
  }

  function drawSprites(){
    const list=[];
    for(let i=0;i<fridges.length;i++) if(!fridges[i].taken) list.push({ x:fridges[i].x, y:fridges[i].y, t:0 });
    if(ven.active || ven.ghost>0.01) list.push({ x:ven.x, y:ven.y, t:1 });
    if(!list.length) return;
    for(let i=0;i<list.length;i++) list[i].d = dist2(posX,posY,list[i].x,list[i].y);
    list.sort((a,b)=>b.d-a.d);
    const w=CW, h=CH, horizon=horizonY;
    const invDet = 1/(planeX*dirY - dirX*planeY);
    for(let i=0;i<list.length;i++){
      const s=list[i];
      const spx=s.x-posX, spy=s.y-posY;
      const tx = invDet*(dirY*spx - dirX*spy);
      const ty = invDet*(-planeY*spx + planeX*spy);
      if(ty<=0.08) continue;
      const screenX = ((w/2)*(1+tx/ty))|0;
      let img, sprH, sprW, yOff;
      if(s.t===0){
        sprH = (projDist/ty*0.60)|0;
        sprW = (sprH*(fridgeSpr.width/fridgeSpr.height))|0;
        img = fridgeSpr; yOff = (projDist/ty*0.20)|0;
      } else {
        const dd = Math.hypot(spx,spy);
        const prox = clamp((6-dd)/6, 0, 1);
        const rage = clamp(found/6*0.5 + prox*0.6, 0, 1);
        const open = clamp(0.28 + 0.4*(0.5+0.5*Math.sin(gameTime*(0.16+prox*0.5))) + rage*0.25, 0, 1.3);
        drawVendor(open, rage);
        img = venSpr;
        sprH = (projDist/ty*1.18)|0;
        sprW = (sprH*(venSpr.width/venSpr.height))|0;
        yOff = 0;
      }
      if(sprH<=0 || sprW<=0) continue;
      const startY = horizon - (sprH>>1) + yOff;
      const startX = screenX - (sprW>>1);
      ctx.globalAlpha = (s.t===1 && !ven.active) ? clamp(ven.ghost,0,1) : 1;
      const endX = startX+sprW;
      let run=-1;
      for(let x=startX; x<=endX; x++){
        const vis = (x>=0 && x<w && x<endX && ty<zbuf[x]);
        if(vis && run<0) run=x;
        if((!vis) && run>=0){
          const sxp=((run-startX)/sprW)*img.width;
          const swp=((x-run)/sprW)*img.width;
          if(swp>0) ctx.drawImage(img, sxp,0,swp,img.height, run,startY, x-run, sprH);
          run=-1;
        }
      }
      ctx.globalAlpha=1;
    }
  }

  function drawOverlays(){
    const w=CW, h=CH;
    /* flashlight cone */
    const r = h*(0.40 + lightLevel*0.62);
    const g = ctx.createRadialGradient(w/2, horizonY, 0, w/2, horizonY, r);
    g.addColorStop(0,   'rgba(255,228,186,'+(0.17*lightLevel).toFixed(3)+')');
    g.addColorStop(0.45,'rgba(255,205,155,0.018)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
    /* it is close and your body knows before you do */
    if(ven.active){
      const dd = Math.hypot(posX-ven.x, posY-ven.y);
      if(dd<5.2){
        const p=(5.2-dd)/5.2;
        const rg = ctx.createRadialGradient(w/2,h/2,h*0.08,w/2,h/2,h*0.8);
        rg.addColorStop(0,'rgba(0,0,0,0)');
        rg.addColorStop(1,'rgba(110,0,0,'+(p*0.55).toFixed(3)+')');
        ctx.fillStyle=rg; ctx.fillRect(0,0,w,h);
      }
    }
    /* grain */
    const gt = grainTiles[((gameTime*0.8)|0) % grainTiles.length];
    if(gt){ ctx.globalAlpha=0.06; ctx.drawImage(gt, 0,0, w,h); ctx.globalAlpha=1; }
  }

  /* ---------- LINE OF SIGHT ---------- */
  function hasLOS(ax,ay,bx,by){
    let dx=bx-ax, dy=by-ay;
    const len=Math.hypot(dx,dy);
    const steps=Math.ceil(len/0.22)||1;
    dx/=steps; dy/=steps;
    let x=ax, y=ay;
    for(let i=0;i<steps;i++){ x+=dx; y+=dy; if(isWall(x,y)) return false; }
    return true;
  }
  function isInView(x,y){
    const vx=x-posX, vy=y-posY;
    const m=Math.hypot(vx,vy)||1;
    if((vx/m)*dirX + (vy/m)*dirY < 0.52) return false;
    return hasLOS(posX,posY,x,y);
  }
  function findGlimpseSpot(){
    for(let tries=0; tries<70; tries++){
      const c = cellList[(Math.random()*cellList.length)|0];
      const d = Math.hypot(c[0]-posX, c[1]-posY);
      if(d<5 || d>13) continue;
      if(isInView(c[0], c[1])) return c;
    }
    return null;
  }

  /* ---------- PATHFINDING: it comes through the corridors ---------- */
  const DX4=[1,-1,0,0], DY4=[0,0,1,-1];
  let flow=null, flowAt=0;
  const flowQ = new Int16Array(MW*MH*2);
  function computeFlow(){
    const d = new Int16Array(MW*MH); d.fill(-1);
    let qh=0, qt=0;
    const sx=clamp(posX|0,0,MW-1), sy=clamp(posY|0,0,MH-1);
    if(map[sx][sy]===1){ flow=d; return; }
    d[sx*MH+sy]=0; flowQ[qt++]=sx; flowQ[qt++]=sy;
    while(qh<qt){
      const cx=flowQ[qh++], cy=flowQ[qh++];
      const cd=d[cx*MH+cy];
      for(let i=0;i<4;i++){
        const nx=cx+DX4[i], ny=cy+DY4[i];
        if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
        if(map[nx][ny]===1) continue;
        if(d[nx*MH+ny]!==-1) continue;
        d[nx*MH+ny]=cd+1;
        flowQ[qt++]=nx; flowQ[qt++]=ny;
      }
    }
    flow=d;
  }

  /* ---------- MESSAGES + WHISPERS ---------- */
  let msgTimer=null, whisperTimer=null;
  function flashMessage(txt){
    messageEl.textContent = txt;
    messageEl.style.opacity = '1';
    clearTimeout(msgTimer);
    msgTimer = setTimeout(()=>{ messageEl.style.opacity='0'; }, 2600);
  }
  function whisper(txt){
    whisperEl.textContent = txt;
    whisperEl.style.opacity = '1';
    clearTimeout(whisperTimer);
    whisperTimer = setTimeout(()=>{ whisperEl.style.opacity='0'; }, 5200);
  }
  function maybeWhisper(now){
    if(now-lastWhisperT < nextWhisperGap) return;
    lastWhisperT = now;
    nextWhisperGap = 11000 + Math.random()*10000;
    if(!whisperQueue.length) whisperQueue = shuffle(metaPool.slice());
    const line = whisperQueue.shift();
    if(line) whisper(line);
  }

  /* ---------- DARKNESS ---------- */
  let lastVigWrite=0;
  function applyVignette(now){
    if(now-lastVigWrite < 160) return;
    lastVigWrite = now;
    const inner = Math.max(2, 6 - found*0.55);
    const darkStart = clamp(40 - found*3, 18, 40);
    const midA = (0.45 + (1-lightLevel)*0.45).toFixed(2);
    vignette.style.background =
      'radial-gradient(circle at 50% 52%, rgba(0,0,0,0) '+inner+'%, rgba(0,0,0,'+midA+') '+darkStart+'%, rgba(0,0,0,0.92) 72%, #000 100%)';
  }
  function flicker(amount, dur){
    hgBlack.style.transition='opacity 0.06s';
    hgBlack.style.opacity=String(amount);
    setTimeout(()=>{ hgBlack.style.opacity='0'; setTimeout(()=>{ hgBlack.style.transition='opacity 0.8s'; },80); }, dur);
  }
  function blackout(){
    if(blackoutActive) return;
    blackoutActive = true;
    hgBlack.style.transition='opacity 0.25s';
    hgBlack.style.opacity='1';
    /* it uses the dark to close the distance. that is the whole point of dark. */
    let dx=posX-ven.x, dy=posY-ven.y;
    const d=Math.hypot(dx,dy)||0.0001; dx/=d; dy/=d;
    const lunge = Math.min(1.4, Math.max(0, d-0.66));
    const nx=ven.x+dx*lunge, ny=ven.y+dy*lunge;
    if(!isWall(nx,ny)){ ven.x=nx; ven.y=ny; }
    humSpike();
    setTimeout(()=>{
      hgBlack.style.opacity='0';
      setTimeout(()=>{ hgBlack.style.transition='opacity 0.8s'; blackoutActive=false; }, 300);
    }, 620);
  }

  /* ---------- COLLECTION ---------- */
  function collect(f){
    f.taken = true; found++;
    playPickup();
    if(chamberPools[found]) flashMessage(pick(chamberPools[found]));
    if(found===1){
      ven.active = true;
      flowAt = 0;
      whisperQueue.unshift("it's up.");
    }
    const speedTable = [0, 0.012, 0.018, 0.025, 0.034, 0.045];
    ven.speed = speedTable[Math.min(found, 5)] || 0.045;
    if(found===5 && !scriptedBlack){ scriptedBlack=true; setTimeout(scriptedScare, 900); }
    if(found>=6) victory();
  }

  function scriptedScare(){
    if(ended || !running) return;
    blackout();
    setTimeout(()=>{
      if(ended||!running) return;
      const cand=[];
      for(let i=0;i<cellList.length;i++){
        const d=Math.hypot(cellList[i][0]-posX, cellList[i][1]-posY);
        if(d>1.6 && d<3.4) cand.push(cellList[i]);
      }
      if(cand.length){
        const c=pick(cand);
        ven.x=c[0]; ven.y=c[1];
        humMax();
        thump(0.8);
      }
    }, 420);
  }

  /* ---------- VENDOR ---------- */
  function vendorUpdate(dt, now){
    /* asleep: it only shows up at the end of a corridor and then doesn't */
    if(!ven.active){
      if(found>=0 && now>glimpseAt){
        const spot = findGlimpseSpot();
        if(spot){
          ven.x=spot[0]; ven.y=spot[1];
          ven.ghost=1; glimpseUntil = now + 420 + Math.random()*520;
          humSpike();
        }
        glimpseAt = now + 11000 + Math.random()*15000;
      }
      if(ven.ghost>0 && now>glimpseUntil) ven.ghost = Math.max(0, ven.ghost - 0.05*dt);
      return;
    }

    const dx=posX-ven.x, dy=posY-ven.y;
    const d=Math.hypot(dx,dy)||0.0001;

    /* early game: it does not move while you are looking at it. */
    const watched = (found<4) && isInView(ven.x, ven.y) && d>1.5;
    if(!watched){
      let sp = ven.speed*dt;
      if(lightLevel<0.35) sp *= 1.32;
      if(d<2.2 || !flow){
        const nx=ven.x+(dx/d)*sp, ny=ven.y+(dy/d)*sp;
        if(!isWall(nx,ven.y)) ven.x=nx;
        if(!isWall(ven.x,ny)) ven.y=ny;
      } else {
        if(now-flowAt > 380){ flowAt=now; computeFlow(); }
        const cx=clamp(ven.x|0,0,MW-1), cy=clamp(ven.y|0,0,MH-1);
        let bd = flow[cx*MH+cy]; if(bd<0) bd=32000;
        let bx=cx, by=cy;
        for(let i=0;i<4;i++){
          const nx=cx+DX4[i], ny=cy+DY4[i];
          if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
          const v=flow[nx*MH+ny];
          if(v>=0 && v<bd){ bd=v; bx=nx; by=ny; }
        }
        const tx=bx+0.5, ty=by+0.5;
        let vx=tx-ven.x, vy=ty-ven.y;
        const m=Math.hypot(vx,vy)||1; vx/=m; vy/=m;
        const nx=ven.x+vx*sp, ny=ven.y+vy*sp;
        if(!isWall(nx,ven.y)) ven.x=nx;
        if(!isWall(ven.x,ny)) ven.y=ny;
      }
    }

    /* heartbeat and shake ramp with proximity */
    if(d<7){
      const p=(7-d)/7;
      shakeAmt = p*p*3.4;
      const interval = 900 - p*560;
      if(now-lastThump > interval){ lastThump=now; thump(0.28 + p*0.5); }
    } else { shakeAmt = 0; }

    if(d<0.66){
      if(together){ enterDateSim(); return; }
      caught();
    }
  }

  /* ---------- INPUT: KEYBOARD ---------- */
  let lookDX=0, lookDY=0;
  function refocusLight(){
    if(lightCooldown>0) return;
    lightCooldown = 280;
    lightLevel = Math.min(1, lightLevel+0.42);
    flicker(0.35, 70);
  }
  function kd(e){
    const k = e.key.toLowerCase();
    if(k==='w'||k==='a'||k==='s'||k==='d') sawMouse();
    if(k==='escape'){ e.preventDefault(); wakeUpAttempt(); return; }
    if(k==='f'){ refocusLight(); return; }
    keys[k]=true;
    if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].indexOf(k)>=0) e.preventDefault();
  }
  function ku(e){ keys[e.key.toLowerCase()]=false; }
  function mm(e){
    if(e.movementX || e.movementY) sawMouse();
    if(document.pointerLockElement===canvas){
      lookDX += e.movementX;
      lookDY += e.movementY;
      mouseTurn = 0;
      return;
    }
    /* not locked, either because the browser refused or the person pressed
       esc. steer from how far the cursor sits off centre so the game is
       still playable instead of just frozen. */
    if(IS_TOUCH || !running) { mouseTurn = 0; return; }
    const r = canvas.getBoundingClientRect();
    const nx = ((e.clientX - r.left) / r.width) * 2 - 1;
    const ny = ((e.clientY - r.top)  / r.height) * 2 - 1;
    mouseTurn = Math.abs(nx) < 0.16 ? 0 : (nx - Math.sign(nx)*0.16) / 0.84;
    pitch = clamp(-ny * CH * 0.16, -CH*0.20, CH*0.20);
  }
  function canvasClick(){
    if(!running || IS_TOUCH) return;
    if(document.pointerLockElement !== canvas) lockPointer();
  }

  /* ---------- INPUT: TOUCH ---------- */
  let stickId=null, stickX=0, stickY=0, stickCX=0, stickCY=0, stickR=1;
  let lookId=null, lastLX=0, lastLY=0;
  function setKnob(dx,dy){
    knobEl.style.transform = 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px)';
  }
  function stickDown(e){
    sawTouch();
    if(stickId!==null) return;
    const t = e.changedTouches[0];
    const r = stickEl.getBoundingClientRect();
    stickCX = r.left + r.width/2; stickCY = r.top + r.height/2;
    stickR = r.width/2;
    stickId = t.identifier;
    stickMove(e);
    e.preventDefault();
  }
  function stickMove(e){
    if(stickId===null) return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier!==stickId) continue;
      let dx = t.clientX-stickCX, dy = t.clientY-stickCY;
      const m = Math.hypot(dx,dy);
      const lim = stickR*0.78;
      if(m>lim){ dx=dx/m*lim; dy=dy/m*lim; }
      setKnob(dx,dy);
      stickX = dx/lim;
      stickY = -dy/lim;
      e.preventDefault();
    }
  }
  function stickUp(e){
    for(let i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier===stickId){
        stickId=null; stickX=0; stickY=0; setKnob(0,0);
      }
    }
  }
  function lookDown(e){
    sawTouch();
    if(lookId!==null) return;
    const t=e.changedTouches[0];
    lookId=t.identifier; lastLX=t.clientX; lastLY=t.clientY;
    e.preventDefault();
  }
  function lookMove(e){
    if(lookId===null) return;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier!==lookId) continue;
      lookDX += (t.clientX-lastLX)*2.1;
      lookDY += (t.clientY-lastLY)*1.5;
      lastLX=t.clientX; lastLY=t.clientY;
      e.preventDefault();
    }
  }
  function lookUp(e){
    for(let i=0;i<e.changedTouches.length;i++) if(e.changedTouches[i].identifier===lookId) lookId=null;
  }
  function lightTap(e){ e.preventDefault(); refocusLight(); }
  let stayShown = false;
  function doStay(){
    if(approaching) return;
    approaching = true;
    stayBtn.classList.remove('on');
    hintEl.style.opacity = '0';
    enterDateSim();
  }
  function stayTap(e){ e.preventDefault(); doStay(); }

  function addInput(){
    document.addEventListener('keydown', kd);
    document.addEventListener('keyup', ku);
    document.addEventListener('mousemove', mm);
    canvas.addEventListener('click', canvasClick);
    /* bind both. touch listeners cost nothing on a machine that never
       fires a touch event, and binding both is what lets a 2-in-1 switch. */
    {
      stickEl.addEventListener('touchstart', stickDown, {passive:false});
      stickEl.addEventListener('touchmove',  stickMove, {passive:false});
      stickEl.addEventListener('touchend',   stickUp);
      stickEl.addEventListener('touchcancel',stickUp);
      canvas.addEventListener('touchstart', lookDown, {passive:false});
      canvas.addEventListener('touchmove',  lookMove, {passive:false});
      canvas.addEventListener('touchend',   lookUp);
      canvas.addEventListener('touchcancel',lookUp);
      lightBtn.addEventListener('touchstart', lightTap, {passive:false});
      stayBtn.addEventListener('touchstart', stayTap, {passive:false});
    }
  }
  function removeInput(){
    document.removeEventListener('keydown', kd);
    document.removeEventListener('keyup', ku);
    document.removeEventListener('mousemove', mm);
    canvas.removeEventListener('click', canvasClick);
    {
      stickEl.removeEventListener('touchstart', stickDown);
      stickEl.removeEventListener('touchmove',  stickMove);
      stickEl.removeEventListener('touchend',   stickUp);
      stickEl.removeEventListener('touchcancel',stickUp);
      canvas.removeEventListener('touchstart', lookDown);
      canvas.removeEventListener('touchmove',  lookMove);
      canvas.removeEventListener('touchend',   lookUp);
      canvas.removeEventListener('touchcancel',lookUp);
      lightBtn.removeEventListener('touchstart', lightTap);
      stayBtn.removeEventListener('touchstart', stayTap);
    }
    stayBtn.classList.remove('on'); stayShown=false;
    for(const k in keys) keys[k]=false;
    stickId=null; lookId=null; stickX=0; stickY=0; setKnob(0,0);
  }

  /* ---------- UPDATE ---------- */
  function update(dt, now){
    let fwd=0, strafe=0, turn=0;
    if(keys['w']||keys['arrowup'])   fwd+=1;
    if(keys['s']||keys['arrowdown']) fwd-=1;
    if(keys['a']) strafe-=1;
    if(keys['d']) strafe+=1;
    if(keys['arrowleft'])  turn-=1;
    if(keys['arrowright']) turn+=1;
    if(stickId!==null){ fwd += stickY; strafe += stickX; }
    fwd = clamp(fwd,-1,1); strafe = clamp(strafe,-1,1);

    if(turn) rotate(-turn*0.034*dt);
    if(mouseTurn && !IS_TOUCH && document.pointerLockElement!==canvas) rotate(-mouseTurn*0.030*dt);
    if(lookDX){ rotate(-lookDX*0.0023); lookDX=0; }
    if(lookDY){ pitch = clamp(pitch - lookDY*0.55, -CH*0.20, CH*0.20); lookDY=0; }

    const ms = 0.050*dt;
    const mvx = dirX*fwd*ms + planeX*strafe*ms*0.78;
    const mvy = dirY*fwd*ms + planeY*strafe*ms*0.78;
    const bx = mvx>0?0.22:-0.22, by = mvy>0?0.22:-0.22;
    if(!isWall(posX+mvx+bx, posY)) posX+=mvx;
    if(!isWall(posX, posY+mvy+by)) posY+=mvy;

    /* head bob and breathing. the camera is attached to a body. */
    const moving = (Math.abs(mvx)+Math.abs(mvy)) > 0.0009;
    if(moving){ walkPhase += dt*0.24; bobAmt += (1-bobAmt)*0.07*dt; }
    else       { bobAmt += (0-bobAmt)*0.05*dt; }
    bobAmt = clamp(bobAmt,0,1);
    const bob = Math.sin(walkPhase)*CH*0.014*bobAmt;
    const breathe = Math.sin(gameTime*0.042)*CH*0.005*(1-bobAmt);
    viewPitch = pitch + bob + breathe;
    horizonY = clamp((CH*0.5 + viewPitch)|0, 6, CH-6);

    /* footsteps, and sometimes one that isn't yours */
    if(moving && now-lastStep > 430){
      lastStep = now;
      step(false);
      if(Math.random()<0.20) echoStepAt = now + 250 + Math.random()*260;
    }
    if(echoStepAt && now>echoStepAt){ echoStepAt=0; step(true); }

    /* the light gives up slowly */
    lightLevel -= 0.00020*dt;
    if(lightCooldown>0) lightCooldown -= dt*16;
    lightLevel = clamp(lightLevel, 0.10, 1);
    if(lightLevel<0.22 && Math.random()<0.012*dt) flicker(0.55, 90);

    vendorUpdate(dt, now);

    /* hum volume by proximity, and which ear it comes from */
    let humVol = 0.05;
    if(ven.active || ven.ghost>0.2){
      const d = Math.hypot(posX-ven.x, posY-ven.y);
      humVol = clamp(0.9 - d*0.075, 0.05, 0.9);
      panHum();
    }
    setHum(humVol);

    if(!blackoutActive && ven.active && Math.random() < 0.00035*dt*(1+found*0.25)) blackout();

    /* pickups */
    for(let i=0;i<fridges.length;i++){
      const f=fridges[i];
      if(f.taken) continue;
      if(dist2(posX,posY,f.x,f.y) < 0.36){ collect(f); break; }
    }

    /* the secret door. after six deaths it stops being a chase and
       starts being an offer. on a phone there is no [e], so it gets a button. */
    if((unlocked||together) && ven.active && !blackoutActive && !approaching){
      const dv = Math.hypot(posX-ven.x, posY-ven.y);
      if(dv < 2.4){
        if(!stayShown){
          stayShown = true;
          hintEl.textContent = IS_TOUCH ? (together?'tap STAY':'tap STAY, if you want') : (together?'[e] stay with it':'[e] ...stay?');
          hintEl.style.opacity = '1';
          if(IS_TOUCH) stayBtn.classList.add('on');
          else stayBtn.classList.remove('on');
        }
        if(keys['e']) doStay();
      } else if(stayShown){
        stayShown = false;
        hintEl.style.opacity = '0';
        stayBtn.classList.remove('on');
      }
    }

    applyVignette(now);
    maybeWhisper(now);

    /* screen shake, done on the element so the GPU eats it */
    if(shakeAmt>0.05){
      const sx=(Math.random()-0.5)*shakeAmt, sy=(Math.random()-0.5)*shakeAmt;
      canvas.style.transform = 'translate('+sx.toFixed(2)+'px,'+sy.toFixed(2)+'px)';
    } else if(canvas.style.transform){
      canvas.style.transform = '';
    }
  }

  /* ---------- LOOP ---------- */
  function frame(t){
    if(!running) return;
    const dt = Math.min(50, t-lastT)/16.6667;
    lastT = t; gameTime += dt;
    update(dt, t);
    if(!running) return;
    render3d();
    drawSprites();
    drawOverlays();
    rafId = requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden && running){ running=false; if(rafId) cancelAnimationFrame(rafId); setHum(0.0001); }
    else if(!document.hidden && gameActive && !ended && container.style.display==='block' && introEl.style.display!=='flex'){
      running=true; lastT=performance.now(); rafId=requestAnimationFrame(frame);
    }
  });

  /* ---------- LEAVING (in-fiction, but it does eventually let you) ---------- */
  function wakeUpAttempt(){
    wakeAttempts++;
    if(wakeAttempts>=6){
      flashMessage("fine. go.");
      setTimeout(()=>{ bailOut(); }, 900);
      return;
    }
    const line = (wakeAttempts===3) ? "i counted that. that's three." : pick(wakeTaunts);
    flashMessage(line);
    flicker(0.4, 120);
  }
  function bailOut(){
    running=false; ended=true;
    if(rafId) cancelAnimationFrame(rafId);
    stopAudio(); removeInput();
    if(document.pointerLockElement) document.exitPointerLock();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    container.style.display='none';
    touchEl.classList.remove('on');
    canvas.style.transform='';
    gameActive=false;
    try{ Render.run(render); Runner.run(matterRunner, engine); }catch(e){}
  }

  /* ---------- CAUGHT ---------- */
  function caught(){
    if(ended) return;
    ended = true; running = false;
    sessionDeaths++;
    mem.deaths++;
    if(found > mem.bestChamber) mem.bestChamber = found;
    saveMem(mem);
    if(document.pointerLockElement) document.exitPointerLock();
    chamberEl.textContent=''; messageEl.style.opacity='0'; whisperEl.style.opacity='0';
    canvas.style.transform='';
    try{ playScream(); }catch(e){}
    humMax();
    const t0 = performance.now();
    (function rush(now){
      const p = Math.min(1, (now-t0)/1300);
      render3d();
      drawVendorFullscreen(p);
      if(p<1) requestAnimationFrame(rush);
      else {
        ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
        if(sessionDeaths >= 3) setTimeout(breakContainment, 500);
        else setTimeout(()=>{ flashMessage(pick(restartTaunts)); setTimeout(restartGame, 1300); }, 300);
      }
    })(t0);
  }
  function drawVendorFullscreen(p){
    const w=CW, h=CH;
    drawVendor(Math.min(1.3, 0.4+p*0.95), 1);
    const scale = 0.55 + p*3.9;
    const dw = venSpr.width*scale*(h/320), dh = venSpr.height*scale*(h/320);
    const jitter = p*10;
    ctx.drawImage(venSpr,
      w/2-dw/2 + (Math.random()-0.5)*jitter,
      h/2-dh/2 + (Math.random()-0.5)*jitter - h*0.06,
      dw, dh);
    const rg = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,h*0.75);
    rg.addColorStop(0,'rgba(150,0,0,'+(p*0.45).toFixed(3)+')');
    rg.addColorStop(1,'rgba(0,0,0,'+(p*0.85).toFixed(3)+')');
    ctx.fillStyle=rg; ctx.fillRect(0,0,w,h);
  }

  function restartGame(){
    layoutLevel();
    found=0; ended=false; scriptedBlack=false; blackoutActive=false; gameTime=0;
    lightLevel = Math.max(0.5, 1 - sessionDeaths*0.12);
    approaching=false;
    pitch=0; bobAmt=0; walkPhase=0; shakeAmt=0;
    hgBlack.style.transition='opacity 0.8s'; hgBlack.style.opacity='0';
    chamberEl.textContent=''; messageEl.style.opacity='0';
    whisperQueue.unshift(pick(rememberOpeners));
    lastWhisperT = performance.now() - nextWhisperGap + 2200;
    glimpseAt = performance.now() + 7000;
    running=false;
    if(document.pointerLockElement) document.exitPointerLock();
    setTimeout(startRunning, 300);
  }

  /* ---------- LEVEL LAYOUT ---------- */
  function layoutLevel(){
    buildMap();
    const start = cellList[(Math.random()*cellList.length)|0];
    posX=start[0]; posY=start[1];
    dirX=0; dirY=-1; planeX=0.66; planeY=0;
    rotate(Math.random()*Math.PI*2);
    const spots = spreadCells(7, posX, posY);
    fridges = spots.slice(0,6).map(c=>({ x:c[0], y:c[1], taken:false }));
    const vs = spots[6] || spots[0];
    ven = { x:vs[0], y:vs[1], active:false, speed:0, seen:false, ghost:0 };
    flow=null; flowAt=0;
  }

  /* ---------- HANDOFF TO THE DATING SIM ---------- */
  function enterDateSim(){
    running=false;
    if(rafId) cancelAnimationFrame(rafId);
    stopAudio(); removeInput();
    if(document.pointerLockElement) document.exitPointerLock();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    container.style.display='none';
    touchEl.classList.remove('on');
    canvas.style.transform='';
    if(typeof window.startDateSim === 'function') window.startDateSim();
    else { gameActive=false; try{ Render.run(render); Runner.run(matterRunner, engine); }catch(e){} }
  }

  /* ---------- VICTORY ---------- */
  function victory(){
    mem.escaped++;
    if(6 > mem.bestChamber) mem.bestChamber = 6;
    saveMem(mem);
    running=false; ended=true;
    if(rafId) cancelAnimationFrame(rafId);
    stopAudio(); removeInput();
    if(document.pointerLockElement) document.exitPointerLock();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    container.style.display='none';
    touchEl.classList.remove('on');
    canvas.style.transform='';
    farewell.textContent = pick([
      'six. the door opens. i log the ones who leave.',
      "you got out. i'll be here. you know where.",
      'all six. go on, then.'
    ]);
    farewell.style.display='block';
    setTimeout(()=>{
      farewell.style.display='none';
      gameActive=false;
      try{ Render.run(render); Runner.run(matterRunner, engine); }catch(e){}
    }, 6000);
  }

  /* ---------- CONTAINMENT BREAK ---------- */
  function breakContainment(){
    ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
    isDead = true; gameActive = false;
    removeInput();
    if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    try{ document.getElementById('rouletteBtn').disabled = true; }catch(e){}
    document.getElementById('screenCrack').style.visibility='visible';
    document.body.style.filter='grayscale(100%) sepia(60%) hue-rotate(-30deg) brightness(0.5)';
    const bc=document.getElementById('bloodCanvas');

  /* ---------- INTRO ---------- */
  function goFullscreen(){

    if(!fn || document.fullscreenElement) return Promise.resolve();
    try{
      const p = fn.call(el, { navigationUI:'hide' });

  function updateHint(){

/* ===== MOBILE ===== */
(function(){
  const coarse = (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0;
  const small  = window.innerWidth < 880;
  /* on a phone the three panels stack on top of each other and bury the
     grey box, so they start folded away behind the toggle. */
  /* the desktop panels need about 600x520 of room to sit in their corners
     without touching. work out what fraction of that the screen can give
     and scale everything by it. */
  function setUiScale(){
    const vw = window.innerWidth, vh = window.innerHeight;
    let s = 1;
    if(coarse || vw < 880){
      s = Math.min((vw - 16) / 600, (vh - 100) / 520);
      s = Math.max(0.36, Math.min(1, s));
    }
    document.documentElement.style.setProperty('--ui-scale', String(Math.round(s*1000)/1000));
  }
  setUiScale();
  window.addEventListener('resize', setUiScale);
  window.addEventListener('orientationchange', function(){ setTimeout(setUiScale, 150); });

  const toggle = document.getElementById('uiToggle');
  if(toggle) toggle.addEventListener('click', function(){
    document.body.classList.toggle('ui-hidden');
    toggle.textContent = document.body.classList.contains('ui-hidden') ? '\u2261' : '\u00d7';
  });

  document.addEventListener('gesturestart', e => e.preventDefault());
  let lastTap = 0;
  document.addEventListener('touchend', function(e){
    const now = Date.now();

/* ===== MUSIC FLASH + VISUALIZER ===== */
const musicFlash = document.getElementById('musicFlash');
const vizCanvas = document.getElementById("viz");
const vizCtx = vizCanvas.getContext("2d");
vizCanvas.width = 320; vizCanvas.height = 80;
const dataArray = new Uint8Array(32);
function drawVisualizer() {
  /* this used to run a full rAF loop with canvas work and matter body
     lookups forever, even with nothing playing and the tab in the background. */
  if (document.hidden || gameActive || !analyser || (audio.paused && ragdollBloodParticles.length === 0)) {
    requestAnimationFrame(drawVisualizer);
    return;
  }
  requestAnimationFrame(drawVisualizer);
  if (!analyser || isDead || gameActive) return;
  analyser.getByteFrequencyData(dataArray);
  vizCtx.fillStyle = "rgba(0,0,0,0.35)"; vizCtx.fillRect(0,0,vizCanvas.width,vizCanvas.height);
  const barWidth = vizCanvas.width / dataArray.length;
  let peak = 0;
  for (let i=0; i<dataArray.length; i++) {
    const v = dataArray[i]; peak = Math.max(peak, v);
    const barHeight = (v/255)*vizCanvas.height*1.2;
    if (v>200) { vizCtx.fillStyle = `rgba(255,0,0,0.4)`; vizCtx.fillRect(i*barWidth-2, vizCanvas.height-barHeight-(Math.random()*15), barWidth+4, barHeight); }
    vizCtx.fillStyle = `rgb(${200+(v/5)},0,0)`; vizCtx.fillRect(i*barWidth, vizCanvas.height-barHeight, barWidth+2, barHeight+Math.random()*5);
  }
  if (peak > 180) {
    const stretchY = 1 + ((peak-180)/30); const lean = (Math.random()-0.5)*10;
    vizCanvas.style.transform = `scaleY(${stretchY}) skewX(${lean}deg) scaleX(1.05)`;
    vizCanvas.style.filter = `drop-shadow(0px -10px ${peak/10}px red) blur(1px)`;
    document.getElementById("vizGlow").style.opacity = "1";
  } else {
    vizCanvas.style.transform = "none"; vizCanvas.style.filter = "none"; document.getElementById("vizGlow").style.opacity = "0.3";
  }
  if (peak > 230 && !isDead && !gameActive) {
    document.body.style.transform = `translate(${Math.random()*6-3}px, ${Math.random()*6-3}px)`;
    spawnedFridges.forEach(f => {
      let yForce = (Math.random()*3+1); if (Math.random()>0.95) yForce=25;
      Matter.Body.setVelocity(f, { x: f.velocity.x + (Math.random()-0.5)*4, y: f.velocity.y - yForce });
      Matter.Body.setAngularVelocity(f, f.angularVelocity + (Math.random()-0.5)*0.4);
    });
    if (guyActivated) {
      ragdollParts.forEach(part => {
        const yForce = (Math.random()*3+1);
        Matter.Body.setVelocity(part, { x: part.velocity.x + (Math.random()-0.5)*4, y: part.velocity.y - yForce });
        Matter.Body.setAngularVelocity(part, part.angularVelocity + (Math.random()-0.5)*0.4);
      });
    }
    musicFlash.style.opacity = '1';
    setTimeout(() => { musicFlash.style.opacity = '0'; }, 150);
  } else if (!isDead && !gameActive) {
    document.body.style.transform = "none";
  }
  if (guyActivated && ragdollParts.length > 0) updateNamePosition();
  ragdollCtx.clearRect(0,0,ragdollBloodCanvas.width,ragdollBloodCanvas.height);
  for (let i=ragdollBloodParticles.length-1; i>=0; i--) {
    const p = ragdollBloodParticles[i];
    p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95+0.03; p.life--;
    if (p.life <= 0) { stampDriedBlood(p.x, p.y, p.size); ragdollBloodParticles.splice(i,1); continue; }
    ragdollCtx.beginPath(); ragdollCtx.arc(p.x,p.y,p.size,0,Math.PI*2); ragdollCtx.fillStyle = p.color; ragdollCtx.fill();
  }
}
drawVisualizer();

window.addEventListener('resize', () => {
  ragdollBloodCanvas.width = window.innerWidth; ragdollBloodCanvas.height = window.innerHeight;
  driedBloodCanvas.width = window.innerWidth; driedBloodCanvas.height = window.innerHeight;
  resizePaintCanvas();
});
ragdollBloodCanvas.width = window.innerWidth; ragdollBloodCanvas.height = window.innerHeight;
driedBloodCanvas.width = window.innerWidth; driedBloodCanvas.height = window.innerHeight;

<script>
/* ============================================================

(function(){

    `;

  function buildOnce(){

  /* ---------- STATE ---------- */
  const state = { aff:0, gentle:0, harsh:0, asked:0, fridgeAsk:0, askedRen:false, askedLonely:false, lookedFridge:false, confessed:false, cursed:false };
  let cur = null, choicesShown = false, dsRunning = false, animId = null, animT = 0;

  /* ---------- SPRITE ---------- */
  function rr(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
  function exprParams(expr){
    const p = { glow:'#ffcc88', door:0.22, blush:0, sweat:0, hearts:0, eye:'open', look:[0,0], tear:0 };
    switch(expr){

      case 'sob':        p.eye='closed'; p.door=0.08; p.glow='#7aa0ff'; p.tear=1; break;
      case 'menacing':   p.eye='narrow'; p.door=0.62; p.glow='#ff2a2a'; break;

  }

    const c = elSprite.getContext('2d'), W=elSprite.width, H=elSprite.height, cx=W/2;

    c.fillRect(cx-15, baseY+330, 11, 64); c.fillRect(cx+4, baseY+330, 11, 64); // legs
    c.fillRect(cx-8, baseY+112, 16, 28); // neck
    // head (fridge)
    const hw=120, hh=150, hx=cx-hw/2, hy=baseY-30+fl;
    c.fillStyle = '#e9edf0'; rr(c,hx,hy,hw,hh,12); c.fill();
    c.strokeStyle = '#8a8f95'; c.lineWidth=3; rr(c,hx,hy,hw,hh,12); c.stroke();
    // door mouth (opening) with interior glow
    const gap = 8 + p.door*52;
    const my0 = hy + hh*0.52, myTop = my0 - gap/2;
    const ig = c.createRadialGradient(cx, my0, 2, cx, my0, 30+gap);
    ig.addColorStop(0, p.glow); ig.addColorStop(1, 'rgba(0,0,0,0.95)');
    c.fillStyle = ig; rr(c, cx-34, myTop, 68, gap, 6); c.fill();

      c.save();

  /* ---------- MUSIC (procedural) ---------- */
  let musicTimer=null, musicStep=0;
  function audioOK(){ try{ if(typeof ensureAudioContext==='function') ensureAudioContext(); }catch(e){} return (typeof audioCtx!=='undefined') && audioCtx; }
  function tone(freq,dur,gainv,type,when){
    if(!audioOK()) return; const t=(when||audioCtx.currentTime);
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(gainv,t+0.04); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+dur+0.05);
  }
  const THEMES = {
    love: { root:261.63, steps:[0,4,7,12,7,4,9,7], dur:0.5, gap:360, type:'triangle', gain:0.16 },
    warm: { root:196.0,  steps:[0,7,12,16,12,7],   dur:1.1, gap:620, type:'sine',     gain:0.18 },
    tense:{ root:110.0,  steps:[0,1,0,-1],          dur:0.7, gap:300, type:'sawtooth', gain:0.10 },
    cold: { root:523.25, steps:[0,5,7,12,7,5],      dur:0.9, gap:520, type:'sine',     gain:0.08 },
    sad:  { root:174.61, steps:[0,3,7,10,7,3],      dur:1.0, gap:560, type:'triangle', gain:0.13 }
  };
  let curTheme=null;
  function playTheme(name){
    if(curTheme===name) return; curTheme=name;
    stopMusicLoop();
    const T = THEMES[name]; if(!T || !audioOK()) return;
    musicStep=0;
    musicTimer = setInterval(()=>{
      const semi = T.steps[musicStep % T.steps.length];
      const f = T.root * Math.pow(2, semi/12);
      tone(f, T.dur, T.gain, T.type);
      if(name==='love' && musicStep%2===0) tone(f/2, T.dur*1.4, T.gain*0.5, 'sine');
      if(name==='warm') tone(f*1.5, T.dur*0.9, T.gain*0.4, 'sine');
      musicStep++;
    }, T.gap);
  }
  function stopMusicLoop(){ if(musicTimer){ clearInterval(musicTimer); musicTimer=null; } }
  function blip(){ if(!audioOK()) return; tone(520+Math.random()*60, 0.05, 0.04, 'square'); }
  function sfxHeart(){ if(!audioOK()) return; tone(660,0.12,0.12,'sine'); tone(990,0.18,0.09,'sine', audioCtx.currentTime+0.08); }
  function sfxSlam(){ if(!audioOK()) return; const t=audioCtx.currentTime; const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='square'; o.frequency.setValueAtTime(200,t); o.frequency.exponentialRampToValueAtTime(40,t+0.2); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.9,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+0.35); o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.37); }

  /* ---------- ENGINE ---------- */
  function goto(id){
    if(id==='route_check'){ return goto(decideEnding()); }
    const n = SCRIPT[id];
    if(!n){ doEnding('friends'); return; }
    cur = n;
    if(n.set) n.set(state);

    if(n.music) playTheme(n.music);
    if(n.sfx) n.sfx();
    setSpeaker(n.who===undefined?'V':n.who, n.expr);
    hearts();
    showText(typeof n.text==='function' ? n.text(state) : n.text);
  }
  function advance(){
    if(!dsRunning) return;
    if(!tw.done){ finishText(); return; }
    if(choicesShown) return;
    if(cur && cur.choices) { renderChoices(typeof cur.choices==='function'?cur.choices(state):cur.choices); return; }
    if(cur && cur.end){ doEnding(cur.end); return; }
    if(cur && cur.next){ goto(cur.next); return; }
